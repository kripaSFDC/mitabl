x-backend-base: &backend-base
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file:
    - ./environments/prod/backend-api.env
  environment:
    DB_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_DB_PASSWORD}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: mysql:8.0
    container_name: mitabl-db
    environment:
      MYSQL_DATABASE: mitabl
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    <<: *backend-base
    container_name: mitabl-backend
    command: ["sh", "start-server.sh"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health/live >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue-worker:
    <<: *backend-base
    container_name: mitabl-queue-worker
    command: ["php", "artisan", "horizon"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *backend-base
    container_name: mitabl-scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q \"artisan schedule:work\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  website:
    build:
      context: ../website
      dockerfile: Dockerfile
    container_name: mitabl-website
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: mitabl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
