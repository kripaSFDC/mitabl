services:
  marketing-web:
    build:
      context: ../website
      dockerfile: Dockerfile
    labels:
      com.mitabl.service: marketing
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    labels:
      com.mitabl.service: api
    command: ["sh", "start-server.sh"]
    environment:
      - RUN_MIGRATIONS_ON_BOOT=${RUN_MIGRATIONS_ON_BOOT:-false}
      - RUN_SEEDERS_ON_BOOT=${RUN_SEEDERS_ON_BOOT:-false}
    env_file:
      - ./environments/backend-api.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/startup && curl -fsS http://localhost:8000/api/health/live && curl -fsS http://localhost:8000/api/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
    depends_on:
      redis:
        condition: service_healthy

  ops-admin:
    build:
      context: ../backend
      dockerfile: Dockerfile
    labels:
      com.mitabl.service: admin
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8001"]
    env_file:
      - ./environments/ops-admin.env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/health/startup && curl -fsS http://localhost:8001/api/health/live && curl -fsS http://localhost:8001/api/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    depends_on:
      redis:
        condition: service_healthy

  queue-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    labels:
      com.mitabl.service: api
    command: ["php", "artisan", "horizon"]
    env_file:
      - ./environments/backend-api.env
    healthcheck:
      test:
        - CMD-SHELL
        - tr '\0' ' ' < /proc/1/cmdline | grep -q "artisan horizon"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
