[program:mitabl-queue-worker]
command=php /app/artisan horizon
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/log/mitabl/queue-worker.log
stderr_logfile=/var/log/mitabl/queue-worker-error.log
