version: "3.9"

services:
  marketing-web:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: mitabl-marketing-web
    env_file:
      - ./deploy/environments/marketing-web.env
    ports:
      - "8080:8080"

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitabl-backend-api
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    env_file:
      - ./deploy/environments/backend-api.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  ops-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitabl-ops-admin
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8001"]
    env_file:
      - ./deploy/environments/ops-admin.env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitabl-queue-worker
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    env_file:
      - ./deploy/environments/backend-api.env
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q \"queue:work\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: mitabl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
