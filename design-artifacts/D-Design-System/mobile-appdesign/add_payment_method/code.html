<h1 class="text-2xl font-black text-[#9c3e20] tracking-tight font-headline">miFoodi</h1>
</div>

<section class="mb-10 text-center">
<h2 class="text-4xl font-extrabold font-headline text-on-surface leading-tight mb-3">Add New Card</h2>
<p class="text-on-surface-variant text-lg">Securely save your payment details for a faster checkout experience.</p>
</section>
<!-- The "Culinary Atelier" Card Concept -->
<div class="bg-surface-container-lowest rounded-lg p-8 shadow-[0_24px_48px_rgba(28,28,25,0.04)] relative overflow-hidden">
<!-- Secure Badge -->
<div class="flex items-center gap-2 mb-8 bg-secondary-container/30 w-fit px-4 py-1.5 rounded-full">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="text-xs font-bold font-label uppercase tracking-widest text-on-secondary-container">Bank-level Security</span>
</div>
<!-- Visual Card Representation (Asymmetric/Tactile) -->
<div class="mb-10 relative">
<div class="w-full aspect-[1.6/1] bg-gradient-to-br from-primary to-primary-container rounded-lg p-6 text-white flex flex-col justify-between shadow-lg transform -rotate-1">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-4xl opacity-80">contactless</span>
<div class="w-12 h-8 bg-white/20 rounded-md backdrop-blur-sm"></div>
</div>
<div>
<div class="text-xl font-headline tracking-widest mb-4">•••• •••• •••• ••••</div>
<div class="flex justify-between items-end">
<div class="uppercase text-[10px] tracking-widest opacity-70 font-label">Card Holder</div>
<div class="uppercase text-[10px] tracking-widest opacity-70 font-label">Expires</div>
</div>
</div>
</div>
<!-- Decorative Layer -->
<div class="absolute -z-10 top-2 left-2 w-full h-full bg-secondary-fixed-dim/30 rounded-lg transform rotate-2"></div>
</div>

<form class="space-y-6">
<!-- Card Number -->
<div class="space-y-2">
<label class="block text-sm font-bold font-label text-on-surface-variant px-1">Card Number</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-4 text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 transition-all font-body text-lg tracking-wider" placeholder="0000 0000 0000 0000" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-2">
<span class="material-symbols-outlined text-outline">credit_card</span>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Expiry Date -->
<div class="space-y-2">
<label class="block text-sm font-bold font-label text-on-surface-variant px-1">Expiry Date</label>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-4 text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 transition-all font-body" placeholder="MM / YY" type="text"/>
</div>
<!-- CVC -->
<div class="space-y-2">
<label class="block text-sm font-bold font-label text-on-surface-variant px-1">CVC / CVV</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-4 text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 transition-all font-body" placeholder="•••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline text-xl">help_outline</span>
</div>
</div>
</div>
<!-- Cardholder Name -->
<div class="space-y-2">
<label class="block text-sm font-bold font-label text-on-surface-variant px-1">Cardholder Name</label>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT px-4 py-4 text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 transition-all font-body" placeholder="e.g. Julian Casablancas" type="text"/>
</div>
<!-- Checkbox Option -->
<label class="flex items-center gap-3 cursor-pointer group mt-4">
<div class="relative">
<input checked="" class="peer hidden" type="checkbox"/>
<div class="w-6 h-6 rounded-md bg-surface-container border-2 border-outline-variant peer-checked:bg-secondary peer-checked:border-secondary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm scale-0 peer-checked:scale-100 transition-transform">check</span>
</div>
</div>
<span class="text-sm font-medium text-on-surface-variant group-hover:text-on-surface transition-colors">Set as default payment method</span>
</label>
<!-- CTA Button: signature textures -->
<button class="w-full mt-8 bg-gradient-to-br from-primary to-primary-container text-white py-5 rounded-full font-headline font-bold text-lg shadow-[0_12px_24px_rgba(156,62,32,0.25)] hover:shadow-[0_16px_32px_rgba(156,62,32,0.35)] active:scale-95 transition-all duration-200" type="button">
                    Save Card Securely
                </button>
</form>
</div>

</div>
</main>
