<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#ffffff",
              "on-primary-fixed-variant": "#802a0d",
              "on-background": "#1c1c19",
              "surface-tint": "#9f4122",
              "tertiary-fixed-dim": "#d9c2b6",
              "error": "#ba1a1a",
              "tertiary-container": "#837166",
              "inverse-on-surface": "#f3f0eb",
              "primary": "#9c3e20",
              "on-primary": "#ffffff",
              "on-secondary-fixed": "#0b200a",
              "secondary-fixed": "#cfeac6",
              "surface-bright": "#fcf9f4",
              "tertiary-fixed": "#f6ded1",
              "on-tertiary-fixed": "#251911",
              "surface-dim": "#dcdad5",
              "surface-container-high": "#ebe8e3",
              "on-tertiary-fixed-variant": "#53443a",
              "on-primary-fixed": "#3a0a00",
              "outline-variant": "#ddc0b8",
              "outline": "#89726b",
              "surface": "#fcf9f4",
              "secondary-fixed-dim": "#b3ceab",
              "secondary": "#4d6548",
              "on-secondary-fixed-variant": "#364c32",
              "surface-container-low": "#f6f3ee",
              "on-error": "#ffffff",
              "primary-fixed": "#ffdbd0",
              "on-secondary": "#ffffff",
              "inverse-primary": "#ffb59f",
              "on-error-container": "#93000a",
              "inverse-surface": "#31302d",
              "tertiary": "#6a594e",
              "on-surface": "#1c1c19",
              "on-secondary-container": "#51694c",
              "surface-variant": "#e5e2dd",
              "background": "#fcf9f4",
              "surface-container-highest": "#e5e2dd",
              "on-surface-variant": "#56423c",
              "error-container": "#ffdad6",
              "secondary-container": "#cce7c3",
              "primary-fixed-dim": "#ffb59f",
              "surface-container": "#f0ede9",
              "on-tertiary-container": "#fffbff",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#bc5636",
              "on-primary-container": "#fffbff"
            },
            fontFamily: {
              "Nunito": ["Nunito", "sans-serif"],
              "DM-Sans": ["DM Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-warm-oat { background-color: #f7f4ef; }
        .text-terracotta { color: #d96c4a; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-warm-oat text-on-surface font-DM-Sans selection:bg-primary/20">
<!-- TopAppBar (Minimal for Security/Lock Focus) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-center px-6 h-16 bg-[#fcf9f4] dark:bg-stone-950 transition-colors">
<div class="flex items-center justify-center">
<span class="material-symbols-outlined text-[#9c3e20] dark:text-[#d96c4a] text-2xl" data-icon="lock">lock</span>
</div>
</header>
<!-- Main Canvas -->
<main class="min-h-screen flex flex-col items-center justify-between py-24 px-8 relative overflow-hidden">
<!-- Subtle Background Motif -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-secondary-container/20 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-primary-fixed/20 rounded-full blur-3xl"></div>
<!-- Identity Section -->
<div class="flex flex-col items-center space-y-2 z-10">
<h1 class="text-3xl font-black text-[#9c3e20] dark:text-[#d96c4a] tracking-tight font-Nunito">Mitabl</h1>
<div class="h-1 w-8 bg-primary rounded-full"></div>
</div>
<!-- Biometric Interaction Zone -->
<div class="flex flex-col items-center w-full max-w-sm space-y-12 z-10">
<!-- Fingerprint Scanner UI -->
<div class="relative group">
<!-- Tonal Ring Layers -->
<div class="absolute inset-0 bg-primary/10 rounded-full scale-150 blur-xl group-hover:bg-primary/20 transition-all duration-700"></div>
<div class="relative w-32 h-32 flex items-center justify-center bg-surface-container-lowest rounded-full shadow-[0_8px_32px_rgba(28,28,25,0.08)] active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-6xl text-terracotta" data-icon="fingerprint" style="font-variation-settings: 'wght' 300;">fingerprint</span>
</div>
</div>
<!-- Security Messaging -->
<div class="text-center space-y-3">
<h2 class="text-2xl font-extrabold text-on-surface font-Nunito leading-tight">Locked for your security</h2>
<p class="text-on-surface-variant font-medium max-w-[240px] mx-auto">Use Face ID or Fingerprint to unlock</p>
</div>
</div>
<!-- Fallback Action Section -->
<div class="w-full max-w-xs space-y-6 z-10">
<button class="w-full py-4 flex items-center justify-center space-x-2 bg-secondary-container text-on-secondary-container rounded-full font-bold uppercase tracking-widest text-[11px] hover:opacity-90 transition-opacity active:scale-95">
<span class="material-symbols-outlined text-lg" data-icon="password">password</span>
<span>Use Password</span>
</button>
<!-- Legal/Privacy Subtle Link -->
<p class="text-center text-[10px] uppercase tracking-tighter text-outline font-bold">
                Your data is protected by Mitabl Encryption
            </p>
</div>
</main>
<!-- Bottom Navigation Shell Suppression (Applied per Rule: Task-Focused/Transactional) -->
<!-- Navigation hidden to prioritize the focused security journey -->
</body></html>
