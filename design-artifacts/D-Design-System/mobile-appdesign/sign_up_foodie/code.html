        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;

            background-color: #fcf9f4;

            font-family: 'Nunito', sans-serif;

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Navigation Shell (Suppressed as per Transactional Rule) -->
<!-- Top Bar Mockup (Internal Page Navigation) -->
<nav class="fixed top-0 w-full z-50 bg-[#fcf9f4]/80 backdrop-blur-md px-6 py-4 flex items-center justify-between">
<button class="text-primary active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="header-anchor text-primary text-2xl tracking-tight">miFoodi</span>
<div class="w-6"></div> <!-- Spacer for centering -->
</nav>
<main class="flex-grow pt-24 pb-12 px-6 max-w-lg mx-auto w-full">
<!-- Hero Section -->
<header class="mb-10 text-center">
<h1 class="font-headline font-extrabold text-4xl text-on-surface mb-2 tracking-tight">Join the Community</h1>
<p class="font-body text-on-surface-variant text-lg">Start your culinary journey with us today.</p>
</header>
<!-- Main Form Card -->
<section class="bg-surface-container-low rounded-lg p-8 shadow-sm">
<form class="space-y-6">
<!-- Name Field -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1 uppercase tracking-wider">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-none rounded-DEFAULT focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant transition-all" placeholder="Chef De Cuisine" type="text"/>
</div>
</div>
<!-- Contact Field -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1 uppercase tracking-wider">Email or Phone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="contact_mail">contact_mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-none rounded-DEFAULT focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant transition-all" placeholder="hello@mifoodi.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1 uppercase tracking-wider">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-lowest border-none rounded-DEFAULT focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Address Field -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1 uppercase tracking-wider">Delivery Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-4 text-outline" data-icon="location_on">location_on</span>
<textarea class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-none rounded-DEFAULT focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant transition-all resize-none" placeholder="Enter your kitchen's location" rows="3"></textarea>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-extrabold text-xl rounded-full shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="submit">
                        Create Account
                        <span class="material-symbols-outlined" data-icon="restaurant_menu">restaurant_menu</span>
</button>
</div>
</form>
</section>
<!-- Terms & Meta -->
<footer class="mt-8 text-center space-y-6">
<p class="text-sm text-on-surface-variant">
                By signing up, you agree to our 
                <a class="text-primary font-bold hover:underline" href="#">Terms of Service</a> and 
                <a class="text-primary font-bold hover:underline" href="#">Privacy Policy</a>.
            </p>
<div class="flex items-center justify-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="text-xs font-bold uppercase tracking-widest text-outline">Or join with</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-4 bg-white rounded-full border border-outline-variant/10 text-on-surface font-semibold text-sm active:scale-95 transition-transform">
<img alt="" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCouv2pk1gDDCHjgB1hz-kahwzR0-ouO7sKCp9p-LZWgFv8Yu8IvbAkm39PvPST2zcKnZ16T0lFTivluQ8fqoy0LN7yK8PCy0nyexLIEcymhPovOya_dZbUsD7c6OEj7SnFIPsGqkah050Wun8c6TD-OJYqH60qMDeKXIBAyqWXgiWHgfBHGMqUQiqqllS7wXwLRslhKzNto2q0nh-ZWx4PkTtNJxOvU5z-8gA_O0bKPSmxbS02s0S_374DePRH0SqJR4Pu5kCK4lHU"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 py-4 bg-white rounded-full border border-outline-variant/10 text-on-surface font-semibold text-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[#1877F2]" data-icon="facebook" data-weight="fill">social_leaderboard</span>
                    Facebook
                </button>
</div>
<div class="pt-6">
<p class="text-on-surface-variant">Already a miFoodi? <a class="text-primary font-bold" href="#">Log In</a></p>
</div>
</footer>
</main>
<!-- Visual Embellishment (Atelier Aesthetic) -->
<div class="fixed -bottom-12 -right-12 w-48 h-48 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-primary text-[12rem]" data-icon="skillet">skillet</span>
</div>
<div class="fixed top-24 -left-8 w-32 h-32 opacity-10 pointer-events-none rotate-12">
<span class="material-symbols-outlined text-primary text-[8rem]" data-icon="eco">eco</span>
</div>
</body></html>
