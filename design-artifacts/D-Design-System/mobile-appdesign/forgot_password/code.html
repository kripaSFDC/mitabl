<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-header {
        background: rgba(252, 249, 244, 0.8);
        backdrop-filter: blur(20px);
      }
      .primary-gradient {
        background: linear-gradient(135deg, #9c3e20 0%, #bc5636 100%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Manual Filter: Transactional page doesn't need full nav, but brand presence) -->
<header class="fixed top-0 w-full z-50 glass-header">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
<span class="font-brand font-extrabold text-xl text-primary tracking-tight">The Culinary Atelier</span>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 py-24">
<div class="w-full max-w-md">
<!-- Editorial Header Section -->
<div class="text-center mb-12">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-secondary-container mb-8">
<span class="material-symbols-outlined text-on-secondary-container text-4xl" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-headline font-extrabold text-4xl text-on-surface mb-4 tracking-tight">Forgot Password?</h1>
<p class="text-on-surface-variant text-lg leading-relaxed">
                    Don't worry! Enter your email below and we'll send you a link to reset your password.
                </p>
</div>
<!-- Interaction Card (Tonal Layering) -->
<div class="bg-surface-container-low p-8 rounded-lg shadow-sm">
<form class="space-y-8">
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-lowest border-none rounded-DEFAULT text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="email" name="email" placeholder="chef@culinaryatelier.com" type="email"/>
</div>
</div>
<button class="w-full h-14 primary-gradient text-on-primary font-bold rounded-full text-lg shadow-lg active:scale-95 transition-transform duration-200 flex items-center justify-center gap-2" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-10 text-center">
<a class="inline-flex items-center gap-2 text-primary font-bold hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
<span>Back to Login</span>
</a>
</div>
</div>
</main>
<!-- Decorative Element (Asymmetric "Atelier" style) -->
<div class="fixed bottom-0 right-0 -z-10 opacity-10 translate-x-1/4 translate-y-1/4">
<div class="w-96 h-96 rounded-full bg-primary-container blur-3xl"></div>
</div>
<div class="fixed top-0 left-0 -z-10 opacity-10 -translate-x-1/4 -translate-y-1/4">
<div class="w-80 h-80 rounded-full bg-secondary-container blur-3xl"></div>
</div>
<!-- Themed Background Image (Ghostly Kitchen Texture) -->
<div class="fixed inset-0 -z-20 pointer-events-none overflow-hidden">
<img alt="" class="w-full h-full object-cover opacity-[0.03] grayscale" data-alt="Soft focused background of a clean modern kitchen counter" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6xUhwDm3nxVENhQU6Rp5fh7cWIBsOCp35gxeGCVM1X6xeOibWksgy_avkRQUqOLI67mWbE98-KeCQQ9SIEO3O24mp8Rd6csXiNflV_y5bUBdBtLAwM-KSPmSGkG1TxoJddIWwDnLYAZoGPZqiTwy4BV0SHShEsHGarqKW_suNhvsEOmwX-jTw1BdXjT50VSidBTllYt1YGuQ_SZz8TVZPWPZ5C2iRcIwgr02ZE35zblBl2C8IWz2yYvlhQr0Ej_NI2WwyxBDsP9Xw"/>
</div>
