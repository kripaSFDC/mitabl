<body class="font-body text-on-surface min-h-screen flex flex-col justify-center items-center overflow-hidden">

<main class="relative w-full max-w-md mx-auto h-screen flex flex-col items-center justify-center p-8">

<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-primary-fixed blur-[100px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-container blur-[100px] rounded-full"></div>
</div>

<div class="z-10 flex flex-col items-center text-center">
<!-- Soft Terracotta Icon Container (Tonal Layering) -->
<div class="mb-8 p-6 bg-surface-container-lowest rounded-xl shadow-sm relative group">

<div class="absolute inset-0 border-2 border-primary/5 rounded-xl"></div>
<div class="w-20 h-20 bg-primary/10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="restaurant_menu" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
</div>
</div>
<!-- Brand Identity -->
<h1 class="font-headline text-5xl font-extrabold text-primary tracking-tighter mb-4">
                Mitabl
            </h1>
<p class="font-body text-lg text-on-surface-variant max-w-[240px] leading-relaxed">
                Taste the heart of your neighborhood.
            </p>
</div>

<div class="absolute bottom-24 flex flex-col items-center space-y-4">
<div class="flex space-x-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<div class="w-2 h-2 rounded-full bg-primary/40"></div>
<div class="w-2 h-2 rounded-full bg-primary/20"></div>
</div>
</div>
<!-- Footer Aesthetic Detail -->
<div class="absolute bottom-12 flex flex-col items-center">
<div class="h-1 w-12 bg-outline-variant/20 rounded-full mb-4"></div>
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant/50">Culinary Connection</span>
</div>
</main>

<div class="fixed top-20 left-[10%] opacity-20 rotate-12 pointer-events-none">
<span class="material-symbols-outlined text-secondary text-6xl" data-icon="spa">spa</span>
</div>

</div>
