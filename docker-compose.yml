services:
  backend:
    image: mitabl-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitabl-backend
    expose:
      - "9000"
    environment:
      - RUN_MIGRATIONS_ON_BOOT=${RUN_MIGRATIONS_ON_BOOT:-false}
      - RUN_SEEDERS_ON_BOOT=${RUN_SEEDERS_ON_BOOT:-false}
      - SESSION_DRIVER=redis
      - CACHE_DRIVER=redis
      - REDIS_CLIENT=phpredis
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=mitabl
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend-web:
    image: nginx:1.27-alpine
    container_name: mitabl-backend-web
    ports:
      - "8000:8000"
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/app/public:ro
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health/live >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: mitabl-website
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mobile-app:
    profiles:
      - mobile-devtools
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: mitabl-mobile
    environment:
      - FLUTTER_ENV=production
    volumes:
      - ./mobile-app:/app
    command: ["sleep", "infinity"]

  db:
    image: mysql:8.0
    container_name: mitabl-db
    restart: always
    environment:
      MYSQL_DATABASE: mitabl
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: mitabl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db_data:
