services:
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitabl-db-migrate
    env_file:
      - ./backend/.env
    command:
      - sh
      - -c
      - |
        php artisan migrate --force
        if [ "${RUN_SEEDERS_ON_BOOT:-false}" = "true" ]; then
          php artisan db:seed --force
        fi
    depends_on:
      db:
        condition: service_healthy
    restart: "no"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitabl-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: mitabl-website
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mobile-app:
    profiles:
      - mobile-devtools
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: mitabl-mobile
    environment:
      - FLUTTER_ENV=production
    volumes:
      - ./mobile-app:/app
    command: ["sleep", "infinity"]

  db:
    image: mysql:8.0
    container_name: mitabl-db
    restart: always
    environment:
      MYSQL_DATABASE: mitabl
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
