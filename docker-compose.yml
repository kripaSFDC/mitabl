x-backend-base: &backend-base
  image: mitabl-backend:latest
  pull_policy: never
  env_file:
    - ./deploy/environments/dev/backend-api.env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  backend:
    <<: *backend-base
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "start-server.sh"]
    environment:
      RUN_MIGRATIONS_ON_BOOT: "true"
      RUN_SEEDERS_ON_BOOT: "true"
      RUN_PERMISSION_SEED_ON_BOOT: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r \"if (@file_get_contents('http://127.0.0.1:8000/api/health/live') === false) { exit(1); }\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue-worker:
    <<: *backend-base
    command: ["php", "artisan", "horizon"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *backend-base
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q \"artisan schedule:work\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: mitabl
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db_data:
  redis_data:
