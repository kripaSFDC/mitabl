# GitHub Actions CI/CD for monorepo
name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lightweight secret scan gate
        run: |
          set -euo pipefail
          PATTERN="(sk_(live|test)_[A-Za-z0-9]+|pk_(live|test)_[A-Za-z0-9]+|00D0w|Integration@)"
          if command -v rg >/dev/null 2>&1; then
            if rg -n -S \
              -g '!**/vendor/**' \
              -g '!**/node_modules/**' \
              -g '!**/storage/**' \
              -g '!**/tests/**' \
              "$PATTERN" \
              backend website deploy; then
              echo "Secret scan failed: suspicious pattern(s) found."
              exit 1
            fi
          else
            if grep -R -n -E "$PATTERN" \
              backend website deploy \
              --exclude-dir=vendor \
              --exclude-dir=node_modules \
              --exclude-dir=storage \
              --exclude-dir=tests; then
              echo "Secret scan failed: suspicious pattern(s) found."
              exit 1
            fi
          fi

  backend:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, xdebug
          coverage: xdebug
      - name: Copy backend env template
        run: |
          cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Finalize backend test environment
        run: |
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
      - name: Run backend tests with coverage gate
        run: composer test:coverage:check
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  support-ticket-contract:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
      - name: Copy backend env template
        run: |
          cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Finalize backend test environment
        run: |
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
      - name: Run support-ticket contract gate
        run: |
          php artisan test tests/Feature/SupportTicketIntakeCrmEndToEndContractTest.php tests/Unit/PhaseThreeSupportTicketServiceTest.php
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

  website:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build and verify static site
        run: npm test

  mobile-app:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: ./mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Install dependencies
        run: flutter pub get
      - name: Run mobile tests
        run: flutter test
